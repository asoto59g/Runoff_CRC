name: Python check

on:
  push:
  pull_request:

jobs:
  pycompile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile project files
        run: python -m py_compile app.py runoff_model.py remote_raster.py clip_dem_by_polygon.py